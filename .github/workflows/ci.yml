name: CI

on:
  push:
    branches:
      - 'main'
      - '1.x'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: Crustum/.github/.github/workflows/testsuite-with-db.yml@v1
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5", "8.6"]'
      db-types: '["mysql", "pgsql"]'
      db-name: 'rhythm_test'
      with-redis: true
      test-cmd: 'vendor/bin/phpunit --configuration=phpunit.xml --display-deprecations --display-incomplete --display-skipped'
      coverage-php: '8.2'
      coverage-db: 'mysql'
    secrets: inherit

  cs:
    uses: Crustum/.github/.github/workflows/cs-stan.yml@v1
    with:
      php: '8.3'
    secrets: inherit
